<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Multi-agent enterprise assistant with RAG, analysis and guarded execution.">
<title>Enterprise Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f46e5'/><text x='16' y='22' font-size='18' font-family='sans-serif' fill='white' text-anchor='middle'>E</text></svg>">
</head>
<body>
<a class="skip-link" href="#input">Skip to message input</a>

<div class="app">
  <!-- ---------------- Sidebar ---------------- -->
  <aside class="sidebar" id="sidebar" aria-label="Workspace navigation">
    <div class="sidebar-head">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 4v10l-7 4-7-4V7z"/><path d="M12 12l7-4M12 12v9M12 12L5 8"/></svg>
        </div>
        <div class="brand-text">
          <strong>Enterprise Assistant</strong>
          <span>Multi-agent workspace</span>
        </div>
      </div>
      <button class="icon-btn only-mobile" id="sidebar-close" aria-label="Close navigation">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <button class="btn btn-primary btn-block" id="new-chat">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      New conversation
    </button>

    <div class="sidebar-section grow">
      <div class="section-title">Recent</div>
      <ul class="conversation-list" id="conversation-list"></ul>
    </div>

    <div class="sidebar-section">
      <div class="section-title">Workspace</div>
      <button class="nav-item" id="open-kb">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
        Knowledge base
        <span class="badge" id="kb-count">–</span>
      </button>
      <button class="nav-item" id="open-agents">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3"/><path d="M5 21v-2a7 7 0 0114 0v2"/></svg>
        Agents
      </button>
    </div>

    <div class="sidebar-foot">
      <div class="status-card" id="status-card" aria-live="polite">
        <div class="status-row"><span class="dot" id="health-dot"></span><span id="health-label">Connecting…</span></div>
        <div class="status-grid" id="status-grid"></div>
      </div>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle colour theme">
        <span class="theme-icon" id="theme-icon" aria-hidden="true"></span>
        <span id="theme-label">Dark mode</span>
      </button>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <!-- ---------------- Main ---------------- -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menu-btn" aria-label="Open navigation">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="topbar-title">
        <h1 id="chat-title">New conversation</h1>
        <p id="chat-subtitle">Ask about company policy, products, or anything in your knowledge base.</p>
      </div>
      <div class="topbar-actions">
        <span class="pill" id="model-pill" title="Active language model">–</span>
        <button class="icon-btn" id="open-key" aria-label="Set API key" title="Authentication / API key">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2L21 2M17 6l2 2M14 9l2 2"/></svg>
        </button>
        <button class="icon-btn" id="clear-chat" aria-label="Clear this conversation" title="Clear conversation">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
        </button>
      </div>
    </header>

    <div class="thread" id="thread">
      <div class="thread-inner" id="messages" role="log" aria-live="polite" aria-relevant="additions"></div>
    </div>

    <button class="scroll-btn" id="scroll-btn" hidden aria-label="Scroll to latest message">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
    </button>

    <footer class="composer-wrap">
      <form class="composer" id="composer">
        <textarea id="input" rows="1" maxlength="4000" placeholder="Ask a question about your documents…" aria-label="Message"></textarea>
        <div class="composer-bar">
          <span class="hint"><kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> for a new line</span>
          <div class="composer-right">
            <span class="counter" id="counter">0 / 4000</span>
            <button type="submit" class="btn btn-primary send-btn" id="send">
              <span id="send-label">Send</span>
              <svg id="send-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
          </div>
        </div>
      </form>
    </footer>
  </main>
</div>

<!-- ---------------- Modal ---------------- -->
<div class="modal-root" id="modal-root" hidden>
  <div class="modal-scrim" id="modal-scrim"></div>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <h2 id="modal-title">Title</h2>
      <button class="icon-btn" id="modal-close" aria-label="Close dialog">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="/static/app.js"></script>
</body>
</html>
