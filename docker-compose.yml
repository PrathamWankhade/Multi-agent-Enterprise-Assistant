# Local full stack: FastAPI app + Qdrant + Redis.
# Ollama is expected on the host at http://host.docker.internal:11434.
# If you use cloud Qdrant/Redis instead, remove the relevant service and set
# QDRANT_HOST / REDIS_HOST in your .env.
services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__LOG__LEVEL=INFO
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Local containers take precedence over values in .env.
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ""
      OPENAI_BASE_URL: http://host.docker.internal:11434/v1
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8000,http://127.0.0.1:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs

volumes:
  qdrant_storage:
  redis_data:
